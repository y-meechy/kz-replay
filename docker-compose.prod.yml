services:
  kz-replay:
    image: kz-replay:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      TZ: Europe/Berlin
      KZ_DATA_DIR: /data/catalog
      KZ_MAPS_DIR: /data/maps
      # The CT character, borrowed out of CS2 on the first start that finds it missing.
      # On the volume for the same reason as the maps: minutes of SteamCMD and the
      # exporter, and nothing about it changes between deploys.
      KZ_MODELS_DIR: /data/models
      # View counts. On the volume, because this is the only data the container
      # cannot rebuild from the API.
      KZ_STATE_DIR: /data/state
      KZ_TOOLS_DIR: /opt/kz-tools
      # Base game assets borrowed out of CS2, one archive part at a time. On the volume
      # rather than in the image: a part is about 105 MB and re-downloading the set on
      # every deploy would be pure waste.
      KZ_CS2_DIR: /data/cs2
    volumes:
      - /var/lib/kz-replay:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
