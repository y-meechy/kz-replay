name: Source2Viewer update

# Valve's map compiler gains new field types now and then, and every map compiled
# afterwards fails to convert until Source2Viewer catches up ("Unknown KVType").
# This opens a pull request as soon as a new Source2Viewer release exists, with the
# version and checksum already filled in. Merging it is enough to retry every map
# that failed: tries are counted per converter release (src/geometry.js).

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - name: Compare the pinned release with the latest one
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^ARG VALVE_RESOURCE_FORMAT_VERSION=//p' Dockerfile)
          latest=$(gh api repos/ValveResourceFormat/ValveResourceFormat/releases/latest --jq .tag_name)
          echo "pinned=$pinned latest=$latest"
          if [ "$pinned" = "$latest" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="source2viewer-$latest"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "branch $branch already exists"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --location --silent --show-error --output /tmp/cli.zip \
            "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${latest}/cli-linux-x64.zip"
          sha=$(sha256sum /tmp/cli.zip | cut -d' ' -f1)
          digest=$(gh api "repos/ValveResourceFormat/ValveResourceFormat/releases/tags/${latest}" \
            --jq '.assets[] | select(.name == "cli-linux-x64.zip") | .digest')
          if [ -n "$digest" ] && [ "$digest" != "sha256:$sha" ]; then
            echo "downloaded archive does not match GitHub's digest $digest" >&2
            exit 1
          fi
          sed -i "s/^ARG VALVE_RESOURCE_FORMAT_VERSION=.*/ARG VALVE_RESOURCE_FORMAT_VERSION=${latest}/; s/^ARG VALVE_RESOURCE_FORMAT_SHA256=.*/ARG VALVE_RESOURCE_FORMAT_SHA256=${sha}/" Dockerfile
          {
            echo "update=true"
            echo "pinned=$pinned"
            echo "latest=$latest"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.update == 'true'
        run: npm ci && npm test
      - name: Open the pull request
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.release.outputs.pinned }}
          LATEST: ${{ steps.release.outputs.latest }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Update Source2Viewer-CLI to $LATEST"
          git push origin "$BRANCH"
          body=$(cat <<EOF
          Source2Viewer-CLI $PINNED → $LATEST ([release notes](https://github.com/ValveResourceFormat/ValveResourceFormat/releases/tag/$LATEST)). Checksum verified against GitHub's asset digest; unit tests pass.

          Before merging, check the lightmap UV convention on a map with atlas scale ≠ 1:

          1. Convert \`kz_sxb2_onlyslide\` with $PINNED and with $LATEST (\`KZ_TOOLS_DIR=… node bin/kzreplay.js map kz_sxb2_onlyslide\`).
          2. \`node scripts/compare-lightmap-uvs.mjs old.glb new.glb\` should print "same convention".
          3. Bump \`LAST_VERIFIED_RELEASE\` in \`src/mapEnvironment.js\` to $LATEST.

          Without step 3 conversions still run, with a warning in the log.
          After merge, every map that failed with $PINNED is retried at the next nightly refresh.
          EOF
          )
          gh pr create --base main --head "$BRANCH" \
            --title "Update Source2Viewer-CLI to $LATEST" --body "$body" \
          || gh issue create --title "Source2Viewer-CLI $LATEST is out" \
            --body "Branch \`$BRANCH\` has the Dockerfile bump; Actions may not open pull requests in this repository, so open it by hand.

          $body"
